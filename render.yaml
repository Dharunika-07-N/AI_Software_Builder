services:
  - type: web
    name: ai-software-builder
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: MOCK_MODE
        value: "true"
      - key: RUNTIME_DB_PATH
        value: runtime.db
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
